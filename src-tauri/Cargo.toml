[package]
name = "rummage"
version = "0.1.0"
description = "Catalog and browse images and videos across all your drives"
license = "MIT"
edition = "2021"

[lib]
name = "rummage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
imagesize = "0.15.0"
jwalk = "0.9.0"
kamadak-exif = "0.6.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tiny_http = "0.12.0"
trash = "5.2.9"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
